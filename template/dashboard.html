<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="container">

<h2>Developer Performance</h2>

<form action="/predict" method="post">

<input name="Hours_Coding" placeholder="Hours Coding">

<input name="Lines_of_Code" placeholder="Lines of Code">

<input name="Bugs_Found" placeholder="Bugs Found">

<input name="Bugs_Fixed" placeholder="Bugs Fixed">

<input name="AI_Usage_Hours" placeholder="AI Usage Hours">

<input name="Sleep_Hours" placeholder="Sleep Hours">

<input name="Cognitive_Load" placeholder="Cognitive Load">

<input name="Task_Success_Rate" placeholder="Task Success Rate">

<input name="Coffee_Intake" placeholder="Coffee Intake">

<input name="Stress_Level" placeholder="Stress Level">

<input name="Task_Duration_Hours" placeholder="Task Duration">

<input name="Commits" placeholder="Commits">

<input name="Errors" placeholder="Errors">

<input name="Complexity" placeholder="Complexity">

<button>Predict Performance</button>

</form>

<br>

<a href="/logout">Logout</a>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const inputs = document.querySelectorAll("input");

    inputs.forEach((input, index) => {

        input.addEventListener("keydown", function (e) {

            if (e.key === "ArrowDown") {
                e.preventDefault();
                if (index + 1 < inputs.length) {
                    inputs[index + 1].focus();
                }
            }

            if (e.key === "ArrowUp") {
                e.preventDefault();
                if (index - 1 >= 0) {
                    inputs[index - 1].focus();
                }
            }

        });

    });

});
</script>

</div>
</body>
</html>
